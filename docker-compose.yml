services:
  printora:
    build: .
    container_name: printora
    restart: unless-stopped
    ports:
      - "8069:8069"
    environment:
      PRINTORA_MOONRAKER_URL: "http://host.docker.internal:7125"
      PRINTORA_DATA_DIR: "/data"
      PRINTORA_HOST_AUDIT_MODE: "disabled"
      PRINTORA_FIRMWARE_BUILD_MODE: "disabled"
    volumes:
      - printora-data:/data

volumes:
  printora-data:
