bind 127.0.0.1 ::1
protected-mode yes
port 0
unixsocket /run/redis-printora/redis.sock
unixsocketperm 770
daemonize no
supervised no
databases 1
save ""
appendonly no
maxmemory 256mb
maxmemory-policy allkeys-lru
timeout 0
tcp-keepalive 300
loglevel notice
logfile ""
dir /var/lib/redis-printora
aclfile /etc/redis/printora-users.acl
rename-command CONFIG ""
rename-command DEBUG ""
rename-command MODULE ""
rename-command SHUTDOWN ""
