# Cluster dedicado ao Printora Cloud. Não compartilhar com outros produtos.
listen_addresses = '127.0.0.1'
archive_mode = on
archive_command = '/usr/local/libexec/printora-cloud/archive-postgresql-wal.sh %p %f'
password_encryption = 'scram-sha-256'
shared_buffers = '256MB'
effective_cache_size = '1GB'
maintenance_work_mem = '128MB'
log_line_prefix = '%m [%p] %q%u@%d request=postgresql '
log_min_duration_statement = 1000
log_checkpoints = on
log_lock_waits = on
deadlock_timeout = '1s'
