[project]
name = "printora-backend"
version = "0.1.41"
description = "Backend API for Printora."
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.40.0,<2",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "psycopg[binary]>=3.2.0,<4",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "redis>=6.0,<7",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=7.0.0,<8"
]

[tool.setuptools]
packages = ["app", "app.firmware", "app.routes"]

[tool.setuptools.package-data]
app = ["data/*.json", "data/agent_releases/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
