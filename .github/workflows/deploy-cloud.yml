name: Deploy Printora Cloud

on:
  workflow_dispatch:

concurrency:
  group: printora-cloud-production
  cancel-in-progress: false

env:
  DEFAULT_SSH_HOST: 187.45.180.181
  DEFAULT_SSH_PORT: "1158"
  DEFAULT_SSH_USER: deploy
  DEFAULT_DEPLOY_BASE_PATH: /var/www/print3dmaker.xyz
  DEFAULT_DEPLOY_BRANCH: cloud

jobs:
  deploy:
    name: Deploy cloud branch to production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout cloud branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEFAULT_DEPLOY_BRANCH }}

      - name: Validate official check
        run: ./check.sh

      - name: Validate cloud target metadata
        run: test -s packaging/cloud/production-target.env.example

      - name: Package release
        run: |
          set -euo pipefail
          DEPLOY_SHA="$(git rev-parse HEAD)"
          echo "DEPLOY_SHA=$DEPLOY_SHA" >> "$GITHUB_ENV"
          tar \
            --exclude='.git' \
            --exclude='backend/.venv' \
            --exclude='frontend/node_modules' \
            --exclude='agent/bin' \
            -czf "/tmp/printora-cloud-release-$DEPLOY_SHA.tgz" .

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRINTORA_SSH_PRIVATE_KEY }}
          SSH_HOST_SECRET: ${{ secrets.PRINTORA_SSH_HOST }}
          SSH_PORT_SECRET: ${{ secrets.PRINTORA_SSH_PORT }}
          SSH_USER_SECRET: ${{ secrets.PRINTORA_SSH_USER }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::Secret PRINTORA_SSH_PRIVATE_KEY nao configurado."
            exit 1
          fi
          SSH_HOST="${SSH_HOST_SECRET:-$DEFAULT_SSH_HOST}"
          SSH_PORT="${SSH_PORT_SECRET:-$DEFAULT_SSH_PORT}"
          SSH_USER="${SSH_USER_SECRET:-$DEFAULT_SSH_USER}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/printora_key
          chmod 600 ~/.ssh/printora_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          {
            echo "SSH_HOST=$SSH_HOST"
            echo "SSH_PORT=$SSH_PORT"
            echo "SSH_USER=$SSH_USER"
          } >> "$GITHUB_ENV"

      - name: Upload release bundle
        run: |
          set -euo pipefail
          scp -i ~/.ssh/printora_key -P "$SSH_PORT" "/tmp/printora-cloud-release-$DEPLOY_SHA.tgz" "$SSH_USER@$SSH_HOST:/tmp/printora-cloud-release-$DEPLOY_SHA.tgz"

      - name: Publish release on target
        env:
          DEPLOY_BASE_PATH_SECRET: ${{ secrets.PRINTORA_DEPLOY_BASE_PATH }}
        run: |
          set -euo pipefail
          DEPLOY_BASE_PATH="${DEPLOY_BASE_PATH_SECRET:-$DEFAULT_DEPLOY_BASE_PATH}"
          ssh -i ~/.ssh/printora_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "DEPLOY_BASE_PATH='$DEPLOY_BASE_PATH' RELEASE_SHA='$DEPLOY_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          RELEASE_DIR="$DEPLOY_BASE_PATH/releases/$RELEASE_SHA"
          BUNDLE="/tmp/printora-cloud-release-$RELEASE_SHA.tgz"

          mkdir -p "$DEPLOY_BASE_PATH/releases" "$DEPLOY_BASE_PATH/shared/data" "$DEPLOY_BASE_PATH/shared/logs"
          test -w "$DEPLOY_BASE_PATH"
          command -v python3 >/dev/null
          python3 --version
          test -s "$BUNDLE"

          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"
          tar -xzf "$BUNDLE" -C "$RELEASE_DIR"

          if [ ! -x "$DEPLOY_BASE_PATH/shared/venv/bin/python" ]; then
            python3 -m venv "$DEPLOY_BASE_PATH/shared/venv"
          fi
          "$DEPLOY_BASE_PATH/shared/venv/bin/python" -m pip install --upgrade pip setuptools wheel
          "$DEPLOY_BASE_PATH/shared/venv/bin/pip" install -e "$RELEASE_DIR/backend"

          if [ ! -f "$DEPLOY_BASE_PATH/shared/printora-cloud.env" ]; then
            cat > "$DEPLOY_BASE_PATH/shared/printora-cloud.env" <<ENV
          PRINTORA_DATA_DIR=$DEPLOY_BASE_PATH/shared/data
          PRINTORA_FRONTEND_DIST_DIR=$DEPLOY_BASE_PATH/current/frontend/dist
          PRINTORA_HOST_AUDIT_MODE=disabled
          PRINTORA_RELEASE_SOURCE_MODE=github
          PRINTORA_RELEASE_GITHUB_OWNER=mayder
          PRINTORA_RELEASE_GITHUB_REPO=printora
          PRINTORA_RELEASE_CHANNEL=stable
          ENV
          fi

          ln -sfn "$RELEASE_DIR" "$DEPLOY_BASE_PATH/current"
          if sudo -n systemctl restart printora-cloud.service; then
            echo "printora-cloud.service restarted by systemctl"
          else
            echo "sudo restart unavailable; restarting deploy-owned uvicorn process"
            set -a
            . "$DEPLOY_BASE_PATH/shared/printora-cloud.env"
            set +a
            cd "$DEPLOY_BASE_PATH/current"
            "$DEPLOY_BASE_PATH/shared/venv/bin/python" - <<'PY'
          import os
          import signal
          import socket
          import subprocess
          import time
          from pathlib import Path

          from app.config import get_settings
          from app.database import initialize_database

          def tcp_listeners_on(port: int) -> set[str]:
              inodes: set[str] = set()
              port_hex = f"{port:04X}"
              for table in ("/proc/net/tcp", "/proc/net/tcp6"):
                  try:
                      lines = Path(table).read_text().splitlines()[1:]
                  except OSError:
                      continue
                  for line in lines:
                      parts = line.split()
                      local_address = parts[1]
                      state = parts[3]
                      inode = parts[9]
                      if state == "0A" and local_address.rsplit(":", 1)[1].upper() == port_hex:
                          inodes.add(inode)
              return inodes

          def pids_for_inodes(inodes: set[str]) -> set[int]:
              pids: set[int] = set()
              if not inodes:
                  return pids
              current_pid = os.getpid()
              for proc in Path("/proc").iterdir():
                  if not proc.name.isdigit():
                      continue
                  pid = int(proc.name)
                  if pid == current_pid or pid == os.getppid():
                      continue
                  fd_dir = proc / "fd"
                  try:
                      for fd in fd_dir.iterdir():
                          try:
                              target = os.readlink(fd)
                          except OSError:
                              continue
                          if target.startswith("socket:[") and target[8:-1] in inodes:
                              pids.add(pid)
                              break
                  except OSError:
                      continue
              return pids

          for sig in (signal.SIGTERM, signal.SIGKILL):
              pids = pids_for_inodes(tcp_listeners_on(8069))
              if not pids:
                  break
              for pid in pids:
                  try:
                      os.kill(pid, sig)
                  except ProcessLookupError:
                      pass
              time.sleep(2 if sig == signal.SIGTERM else 1)

          settings = get_settings()
          initialize_database(settings.database_path)

          base_path = Path(os.environ["DEPLOY_BASE_PATH"])
          log_path = base_path / "shared" / "logs" / "printora-cloud.log"
          log_path.parent.mkdir(parents=True, exist_ok=True)
          log = open(log_path, "ab", buffering=0)
          subprocess.Popen(
              [
                  str(base_path / "shared" / "venv" / "bin" / "python"),
                  "-m",
                  "uvicorn",
                  "app.main:app",
                  "--app-dir",
                  str(base_path / "current" / "backend"),
                  "--host",
                  "127.0.0.1",
                  "--port",
                  "8069",
              ],
              cwd=str(base_path / "current"),
              stdin=subprocess.DEVNULL,
              stdout=log,
              stderr=log,
              start_new_session=True,
              close_fds=True,
          )
          PY
          fi

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8069/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              sudo -n systemctl status printora-cloud.service --no-pager || true
              ps -ef | grep -E 'uvicorn|printora-cloud' | grep -v grep || true
              tail -120 "$DEPLOY_BASE_PATH/shared/logs/printora-cloud.log" || true
              exit 1
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8069/api/catalog >/dev/null
          rm -f "$BUNDLE"
          REMOTE

      - name: Validate public endpoint
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS https://print3dmaker.xyz/health >/dev/null \
              && curl -fsS https://print3dmaker.xyz/api/catalog >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          curl -fsS https://print3dmaker.xyz/health
          curl -fsS https://print3dmaker.xyz/api/catalog >/dev/null
