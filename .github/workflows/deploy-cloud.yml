name: Deploy Printora Cloud

on:
  workflow_dispatch:

concurrency:
  group: printora-cloud-production
  cancel-in-progress: false

env:
  DEFAULT_SSH_HOST: 187.45.180.181
  DEFAULT_SSH_PORT: "1158"
  DEFAULT_SSH_USER: deploy
  DEFAULT_DEPLOY_BASE_PATH: /var/www/print3dmaker.xyz
  DEFAULT_DEPLOY_BRANCH: cloud

jobs:
  deploy:
    name: Deploy cloud branch with blue green switch
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout cloud branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.DEFAULT_DEPLOY_BRANCH }}

      - name: Configure Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configure Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.25.12
          cache-dependency-path: agent/go.sum

      - name: Configure uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.11.0
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Validate complete package gate
        env:
          RUN_PYTHON_TESTS: "1"
          RUN_FRONTEND_CHECKS: "1"
          CHECK_STRICT_SECRETS: "1"
          CHECK_STRICT_RUNTIME_NAMES: "1"
        run: ./check.sh

      - name: Audit production dependencies
        run: |
          set -euo pipefail
          npm --prefix frontend audit --omit=dev --audit-level=high
          cd backend
          uv run --with pip-audit==2.10.1 pip-audit --local
          cd ../agent
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Generate reproducible SBOM
        run: scripts/generate-sbom.sh

      - name: Package immutable release
        run: |
          set -euo pipefail
          DEPLOY_SHA="$(git rev-parse HEAD)"
          echo "DEPLOY_SHA=$DEPLOY_SHA" >> "$GITHUB_ENV"
          test -s frontend/dist/index.html
          tar \
            --exclude='.git' \
            --exclude='backend/.venv' \
            --exclude='frontend/node_modules' \
            --exclude='agent/bin' \
            -czf "/tmp/printora-cloud-release-$DEPLOY_SHA.tgz" .
          sha256sum "/tmp/printora-cloud-release-$DEPLOY_SHA.tgz" > "/tmp/printora-cloud-release-$DEPLOY_SHA.tgz.sha256"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRINTORA_SSH_PRIVATE_KEY }}
          SSH_HOST_SECRET: ${{ secrets.PRINTORA_SSH_HOST }}
          SSH_PORT_SECRET: ${{ secrets.PRINTORA_SSH_PORT }}
          SSH_USER_SECRET: ${{ secrets.PRINTORA_SSH_USER }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" || { echo "::error::Secret PRINTORA_SSH_PRIVATE_KEY nao configurado."; exit 1; }
          SSH_HOST="${SSH_HOST_SECRET:-$DEFAULT_SSH_HOST}"
          SSH_PORT="${SSH_PORT_SECRET:-$DEFAULT_SSH_PORT}"
          SSH_USER="${SSH_USER_SECRET:-$DEFAULT_SSH_USER}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/printora_key
          chmod 600 ~/.ssh/printora_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          {
            echo "SSH_HOST=$SSH_HOST"
            echo "SSH_PORT=$SSH_PORT"
            echo "SSH_USER=$SSH_USER"
          } >> "$GITHUB_ENV"

      - name: Validate privileged preflight
        run: ssh -i ~/.ssh/printora_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" sudo -n /usr/local/sbin/printora-cloud-preflight

      - name: Upload release bundle
        run: |
          scp -i ~/.ssh/printora_key -P "$SSH_PORT" \
            "/tmp/printora-cloud-release-$DEPLOY_SHA.tgz" \
            "/tmp/printora-cloud-release-$DEPLOY_SHA.tgz.sha256" \
            "$SSH_USER@$SSH_HOST:/tmp/"

      - name: Prepare independent release
        env:
          DEPLOY_BASE_PATH_SECRET: ${{ secrets.PRINTORA_DEPLOY_BASE_PATH }}
        run: |
          set -euo pipefail
          DEPLOY_BASE_PATH="${DEPLOY_BASE_PATH_SECRET:-$DEFAULT_DEPLOY_BASE_PATH}"
          ssh -i ~/.ssh/printora_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "DEPLOY_BASE_PATH='$DEPLOY_BASE_PATH' RELEASE_SHA='$DEPLOY_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          release_dir="$DEPLOY_BASE_PATH/releases/$RELEASE_SHA"
          bundle="/tmp/printora-cloud-release-$RELEASE_SHA.tgz"
          checksum="$bundle.sha256"
          cd /tmp
          sha256sum -c "$checksum"
          if [[ -e "$release_dir" && -s "$release_dir/RELEASE_SHA" ]]; then
            test "$(cat "$release_dir/RELEASE_SHA")" = "$RELEASE_SHA"
            test -x "$release_dir/venv/bin/python"
            test -s "$release_dir/frontend/dist/index.html"
            rm -f "$bundle" "$checksum"
            exit 0
          fi
          if [[ -e "$release_dir" ]]; then
            active_release="$(readlink -f "$DEPLOY_BASE_PATH/current" 2>/dev/null || true)"
            [[ "$active_release" != "$release_dir" ]] || { echo "release ativa sem marcador; intervenção manual necessária" >&2; exit 1; }
            rm -rf -- "$release_dir"
          fi
          mkdir -p "$release_dir"
          tar -xzf "$bundle" -C "$release_dir"
          python3 -m venv "$release_dir/venv"
          "$release_dir/venv/bin/pip" install --disable-pip-version-check 'uv==0.11.0'
          VIRTUAL_ENV="$release_dir/venv" "$release_dir/venv/bin/uv" sync --active --frozen --no-dev --project "$release_dir/backend" --python "$release_dir/venv/bin/python"
          (
            cd "$release_dir/backend"
            "$release_dir/venv/bin/python" -c 'import app, fastapi, uvicorn'
          )
          printf '%s\n' "$RELEASE_SHA" > "$release_dir/RELEASE_SHA"
          rm -f "$bundle" "$checksum"
          REMOTE

      - name: Switch traffic and drain previous slot
        run: ssh -i ~/.ssh/printora_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" sudo -n /usr/local/sbin/printora-cloud-deploy "$DEPLOY_SHA"

      - name: Validate public endpoint
        run: |
          set -euo pipefail
          EXPECTED_AGENT_VERSION="$(python3 -c 'import json; print(json.load(open("backend/app/data/agent_update_manifest.json"))["recommended_version"])')"
          for attempt in $(seq 1 30); do
            if curl --max-time 5 -fsS https://print3dmaker.xyz/health >/dev/null \
              && curl --max-time 5 -fsS https://print3dmaker.xyz/ready >/dev/null \
              && curl --max-time 5 -fsS https://print3dmaker.xyz/api/catalog >/dev/null \
              && MANIFEST_JSON="$(curl --max-time 5 -fsS "https://print3dmaker.xyz/api/agent/update/manifest?deploy_sha=$DEPLOY_SHA")" \
              && python3 -c 'import json,sys; raise SystemExit(0 if json.loads(sys.stdin.read()).get("recommended_version") == sys.argv[1] else 1)' "$EXPECTED_AGENT_VERSION" <<< "$MANIFEST_JSON"; then
              exit 0
            fi
            sleep 2
          done
          exit 1
